name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,checkpoint,analysis]" ruff pytest-cov
      - run: ruff check simsim tests examples
      - run: pytest -q --cov=simsim --cov-report=term
      - name: examples (dry run, fake model)
        run: |
          for ex in negotiation memory_tasks social_feed identity_conflict survey_panel town public_goods; do
            python examples/$ex.py --dry-run --seeds 1 --out /tmp/dry/$ex
          done
          for cfg in examples/configs/*.yaml; do
            simsim run "$cfg" --dry-run --seeds 1 --out "/tmp/dry/cfg_$(basename $cfg .yaml)"
          done
