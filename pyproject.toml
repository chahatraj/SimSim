[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simsim"
version = "0.6.0"
description = "Build, run, and log LLM agent simulations for research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pyyaml>=6"]

[project.optional-dependencies]
litellm = ["litellm"]
checkpoint = ["cloudpickle"]
analysis = ["pandas"]
dev = ["pytest", "cloudpickle"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.setuptools.packages.find]
include = ["simsim*"]

[project.scripts]
simsim = "simsim.cli:main"
